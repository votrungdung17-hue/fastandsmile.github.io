<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
     <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BIÊN BẢN BẤT THƯỜNG">
    <title>BIÊN BẢN BẤT THƯỜNG</title>

    <!-- Icon / Favicon -->
    <link rel="icon" type="image/png" href="https://votrungdung17-hue.github.io/fastandsmile.github.io/bbbt_1.png">
    <link rel="apple-touch-icon" href="https://votrungdung17-hue.github.io/fastandsmile.github.io/bbbt_1.png">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #1f2937;
            line-height: 1.4;
            padding-bottom: 90px;
        }

        .header-bar {
            background-color: #0056b3;
            color: #ffffff;
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-bar h1 {
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .save-status {
            font-size: 11px;
            background: rgba(255,255,255,0.2);
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 500;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 12px;
        }

        .document-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            margin-bottom: 16px;
        }

        .org-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 12px;
            color: #374151;
            padding-bottom: 12px;
            border-bottom: 1px dashed #e5e7eb;
            margin-bottom: 12px;
        }

        .org-name {
            font-weight: bold;
            line-height: 1.3;
            color: #0054a6;
            text-transform: uppercase;
        }

        .doc-title {
            text-align: center;
            color: #0056b3;
            font-size: 18px;
            font-weight: 800;
            margin: 15px 0 16px 0;
            line-height: 1.3;
            text-transform: uppercase;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: #0056b3;
            margin-top: 15px;
            margin-bottom: 10px;
            border-left: 3px solid #0056b3;
            padding-left: 8px;
            text-transform: uppercase;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        @media (max-width: 600px) {
            .meta-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 4px;
        }

        .form-group input, .form-group select, .form-group textarea {
            padding: 8px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            background-color: #fff;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #0056b3;
            box-shadow: 0 0 0 2px rgba(0, 86, 179, 0.15);
        }

        .note-box {
            margin-top: 12px;
            background: #ffffff;
            border: 1px solid #d1d5db;
            padding: 12px;
            border-radius: 6px;
        }

        .note-box label {
            font-size: 12px;
            font-weight: 700;
            color: #374151;
            display: block;
            margin-bottom: 6px;
        }

        .note-box textarea {
            width: 100%;
            height: 90px;
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 13px;
            resize: vertical;
            outline: none;
        }

        .signature-section {
            margin-top: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 600px) {
            .signature-section {
                grid-template-columns: 1fr;
            }
        }

        .sig-box {
            border: 1px dashed #9ca3af;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            background: #fafafa;
        }

        .sig-title {
            font-size: 12px;
            font-weight: 700;
            color: #374151;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .sig-canvas-wrap {
            position: relative;
            width: 100%;
            height: 110px;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            margin-bottom: 8px;
            touch-action: none;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .sig-name-input {
            width: 100%;
            padding: 6px 8px;
            font-size: 12px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            margin-bottom: 8px;
            text-align: center;
            font-weight: 600;
        }

        .sig-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            border: 1px solid #d1d5db;
            cursor: pointer;
            background: #ffffff;
            color: #374151;
            font-weight: 600;
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #e5e7eb;
            padding: 10px 16px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .btn-primary {
            flex: 1;
            background: #0056b3;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #d1d5db;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        #print-area {
            display: none;
        }

        @media print {
            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            
            .header-bar, .container, .bottom-bar {
                display: none !important;
            }

            #print-area {
                display: block !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }

            @page {
                size: A4 portrait;
                margin: 15mm 15mm 15mm 15mm;
            }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>BIÊN BẢN BẤT THƯỜNG (BM-CNVN-045)</h1>
        <span class="save-status" id="save-status">✓ ĐÃ TỰ ĐỘNG LƯU</span>
    </div>

    <div class="container">
        <div class="document-card">
            
            <div class="org-header">
                <div class="org-name">
                    TCT HÀNG KHÔNG VIỆT NAM<br>
                    CHI NHÁNH KHU VỰC VIỆT NAM
                </div>
            </div>

            <div class="doc-title">BIÊN BẢN BẤT THƯỜNG</div>

            <div class="section-title">THÔNG TIN SỰ VIỆC</div>
            <div class="meta-grid">
                <div class="form-group">
                    <label>NGÀY XẢY RA:</label>
                    <input type="date" id="date-input" oninput="saveData()">
                </div>
                <div class="form-group">
                    <label>THỜI GIAN (GIỜ/PHÚT):</label>
                    <input type="time" id="time-input" oninput="saveData()">
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 12px;">
                <label>ĐỊA ĐIỂM XẢY RA SỰ CỐ:</label>
                <input type="text" id="location-input" placeholder="VD: Sân đỗ bài 19..." oninput="saveData()">
            </div>

            <div class="section-title">THÀNH PHẦN THAM GIA (CÙNG NHAU LẬP BIÊN BẢN)</div>
            
            <div class="meta-grid" style="margin-bottom: 8px;">
                <div class="form-group">
                    <label>1. ÔNG/BÀ (HỌ TÊN): </label>
                    <input type="text" id="person-1" placeholder="Nhập họ tên..." oninput="saveData()">
                </div>
                <div class="form-group">
                    <label>ĐẠI DIỆN: </label>
                    <input type="text" id="rep-1" placeholder="VD: VNA..." oninput="saveData()">
                </div>
            </div>

            <div class="meta-grid" style="margin-bottom: 8px;">
                <div class="form-group">
                    <label>2. ÔNG/BÀ (HỌ TÊN):</label>
                    <input type="text" id="person-2" placeholder="Nhập họ tên..." oninput="saveData()">
                </div>
                <div class="form-group">
                    <label>ĐẠI DIỆN:</label>
                    <input type="text" id="rep-2" placeholder="VD: Đội xe..." oninput="saveData()">
                </div>
            </div>

            <div class="meta-grid" style="margin-bottom: 8px;">
                <div class="form-group">
                    <label>3. ÔNG/BÀ (HỌ TÊN):</label>
                    <input type="text" id="person-3" placeholder="Nhập họ tên..." oninput="saveData()">
                </div>
                <div class="form-group">
                    <label>ĐẠI DIỆN:</label>
                    <input type="text" id="rep-3" placeholder="VD: Bên liên quan..." oninput="saveData()">
                </div>
            </div>

            <div class="section-title">NỘI DUNG XÁC NHẬN SỰ VIỆC</div>
            <div class="note-box">
                <label>MÔ TẢ CHI TIẾT NỘI DUNG SỰ VIỆC:</label>
                <textarea id="description-input" style="height: 120px;" placeholder="Nhập chi tiết diễn biến sự việc bất thường xảy ra..." oninput="saveData()"></textarea>
            </div>

            <div class="form-group" style="margin-top: 12px;">
                <label>Biên bản này được lập có sự chứng kiến và ký nhận của các bên liên quan.</label>
            </div>

            <div class="section-title">CHỮ KÝ CÁC BÊN</div>
            <div class="signature-section">
                <div class="sig-box">
                    <div class="sig-title">ĐẠI DIỆN VNA</div>
                    <div class="sig-canvas-wrap" id="wrap-sig-1">
                        <canvas id="canvas-sig-1"></canvas>
                    </div>
                    <input type="text" class="sig-name-input" id="name-sig-1" placeholder="Họ và tên..." oninput="saveData()">
                    <div class="sig-actions">
                        <button class="btn-sm" onclick="clearSignature(1)">XÓA / KÝ LẠI</button>
                        <span id="sig-status-1" style="font-size: 11px; font-weight: bold; color: #10b981;"></span>
                    </div>
                </div>

                <div class="sig-box">
                    <div class="sig-title">ĐẠI DIỆN CÁC BÊN LIÊN QUAN</div>
                    <div class="sig-canvas-wrap" id="wrap-sig-2">
                        <canvas id="canvas-sig-2"></canvas>
                    </div>
                    <input type="text" class="sig-name-input" id="name-sig-2" placeholder="Họ và tên..." oninput="saveData()">
                    <div class="sig-actions">
                        <button class="btn-sm" onclick="clearSignature(2)">XÓA / KÝ LẠI</button>
                        <span id="sig-status-2" style="font-size: 11px; font-weight: bold; color: #10b981;"></span>
                    </div>
                </div>

                <div class="sig-box">
                    <div class="sig-title">NGƯỜI LÀM CHỨNG</div>
                    <div class="sig-canvas-wrap" id="wrap-sig-3">
                        <canvas id="canvas-sig-3"></canvas>
                    </div>
                    <input type="text" class="sig-name-input" id="name-sig-3" placeholder="Họ và tên..." oninput="saveData()">
                    <div class="sig-actions">
                        <button class="btn-sm" onclick="clearSignature(3)">XÓA / KÝ LẠI</button>
                        <span id="sig-status-3" style="font-size: 11px; font-weight: bold; color: #10b981;"></span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="bottom-bar">
        <button class="btn-secondary" onclick="resetForm()">LÀM MỚI</button>
        <button class="btn-primary" onclick="exportToPDF()">XUẤT PDF / IN</button>
    </div>

    <div id="print-area"></div>

    <script>
        const STORAGE_KEY = 'bien_ban_bat_thuong_official_data';

        let sigDrawn = [false, false, false, false];
        let sigDataUrl = ['', '', '', ''];

        document.getElementById('date-input').valueAsDate = new Date();

        function isCanvasBlank(canvas) {
            const ctx = canvas.getContext('2d');
            const pixelBuffer = new Uint32Array(
                ctx.getImageData(0, 0, canvas.width, canvas.height).data.buffer
            );
            return !pixelBuffer.some(color => color !== 0);
        }

        function saveData() {
            for (let i = 1; i <= 3; i++) {
                const cv = document.getElementById(`canvas-sig-${i}`);
                if (cv && !isCanvasBlank(cv)) {
                    sigDrawn[i] = true;
                    sigDataUrl[i] = cv.toDataURL('image/png');
                }
            }

            const dataToSave = {
                date: document.getElementById('date-input').value,
                time: document.getElementById('time-input').value,
                location: document.getElementById('location-input').value,
                person1: document.getElementById('person-1').value,
                rep1: document.getElementById('rep-1').value,
                person2: document.getElementById('person-2').value,
                rep2: document.getElementById('rep-2').value,
                person3: document.getElementById('person-3').value,
                rep3: document.getElementById('rep-3').value,
                description: document.getElementById('description-input').value,
                nameSig1: document.getElementById('name-sig-1').value,
                nameSig2: document.getElementById('name-sig-2').value,
                nameSig3: document.getElementById('name-sig-3').value,
                sigDataUrl1: sigDrawn[1] ? sigDataUrl[1] : '',
                sigDataUrl2: sigDrawn[2] ? sigDataUrl[2] : '',
                sigDataUrl3: sigDrawn[3] ? sigDataUrl[3] : ''
            };

            localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
            
            const statusEl = document.getElementById('save-status');
            statusEl.innerText = "✓ ĐÃ TỰ ĐỘNG LƯU";
            statusEl.style.opacity = "1";
        }

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) return;

            try {
                const parsed = JSON.parse(saved);
                if (parsed.date) document.getElementById('date-input').value = parsed.date;
                if (parsed.time) document.getElementById('time-input').value = parsed.time;
                if (parsed.location) document.getElementById('location-input').value = parsed.location;
                
                if (parsed.person1) document.getElementById('person-1').value = parsed.person1;
                if (parsed.rep1) document.getElementById('rep-1').value = parsed.rep1;
                if (parsed.person2) document.getElementById('person-2').value = parsed.person2;
                if (parsed.rep2) document.getElementById('rep-2').value = parsed.rep2;
                if (parsed.person3) document.getElementById('person-3').value = parsed.person3;
                if (parsed.rep3) document.getElementById('rep-3').value = parsed.rep3;

                if (parsed.description) document.getElementById('description-input').value = parsed.description;

                if (parsed.nameSig1) document.getElementById('name-sig-1').value = parsed.nameSig1;
                if (parsed.nameSig2) document.getElementById('name-sig-2').value = parsed.nameSig2;
                if (parsed.nameSig3) document.getElementById('name-sig-3').value = parsed.nameSig3;

                for(let i = 1; i <= 3; i++) {
                    if (parsed['sigDataUrl' + i]) {
                        sigDataUrl[i] = parsed['sigDataUrl' + i];
                        sigDrawn[i] = true;
                        loadSignatureToCanvas(i, parsed['sigDataUrl' + i]);
                    }
                }
            } catch (e) {
                console.error("LỖI KHÔI PHỤC DỮ LIỆU:", e);
            }
        }

        function loadSignatureToCanvas(id, dataUrl) {
            const canvas = document.getElementById(`canvas-sig-${id}`);
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.onload = function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                document.getElementById(`sig-status-${id}`).innerText = "✓ ĐÃ KÝ";
            };
            img.src = dataUrl;
        }

        function initSignatureCanvas(id) {
            const canvas = document.getElementById(`canvas-sig-${id}`);
            const wrap = document.getElementById(`wrap-sig-${id}`);
            const ctx = canvas.getContext('2d');
            let isDrawing = false;

            function resize() {
                const rect = wrap.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#002b66';

                if (sigDataUrl[id]) loadSignatureToCanvas(id, sigDataUrl[id]);
            }

            window.addEventListener('resize', resize);
            setTimeout(resize, 200);

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            function start(e) {
                isDrawing = true;
                sigDrawn[id] = true;
                const p = getPos(e);
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
            }

            function move(e) {
                if (!isDrawing) return;
                e.preventDefault();
                const p = getPos(e);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
            }

            function stop() {
                if (isDrawing) {
                    isDrawing = false;
                    const url = canvas.toDataURL('image/png');
                    sigDataUrl[id] = url;
                    document.getElementById(`sig-status-${id}`).innerText = "✓ ĐÃ KÝ";
                    saveData();
                }
            }

            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', move);
            canvas.addEventListener('mouseup', stop);

            canvas.addEventListener('touchstart', start, { passive: false });
            canvas.addEventListener('touchmove', move, { passive: false });
            canvas.addEventListener('touchend', stop);
        }

        initSignatureCanvas(1);
        initSignatureCanvas(2);
        initSignatureCanvas(3);

        function clearSignature(id) {
            const canvas = document.getElementById(`canvas-sig-${id}`);
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById(`name-sig-${id}`).value = '';
            sigDrawn[id] = false;
            sigDataUrl[id] = '';
            document.getElementById(`sig-status-${id}`).innerText = "";
            saveData();
        }

        function resetForm() {
            if (confirm("LÀM MỚI SẼ XÓA HẾT TOÀN BỘ DỮ LIỆU ĐÃ LƯU. BẠN CÓ CHẮC CHẮN KHÔNG?")) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }

        function exportToPDF() {
            for (let i = 1; i <= 3; i++) {
                const cv = document.getElementById(`canvas-sig-${i}`);
                if (cv && !isCanvasBlank(cv)) {
                    sigDrawn[i] = true;
                    sigDataUrl[i] = cv.toDataURL('image/png');
                }
            }

            const dateVal = document.getElementById('date-input').value;
            let day = '', month = '', year = '';
            if (dateVal) {
                const parts = dateVal.split('-');
                year = parts[0];
                month = parts[1];
                day = parts[2];
            }

            const timeVal = document.getElementById('time-input').value;
            let hour = '', minute = '';
            if (timeVal) {
                const tParts = timeVal.split(':');
                hour = tParts[0];
                minute = tParts[1];
            }

            const location = document.getElementById('location-input').value || '';
            
            const p1 = document.getElementById('person-1').value || '';
            const r1 = document.getElementById('rep-1').value || '';
            
            const p2 = document.getElementById('person-2').value || '';
            const r2 = document.getElementById('rep-2').value || '';

            const p3 = document.getElementById('person-3').value || '';
            const r3 = document.getElementById('rep-3').value || '';

            const description = document.getElementById('description-input').value || '';

            const nameSig1 = document.getElementById('name-sig-1').value || '';
            const nameSig2 = document.getElementById('name-sig-2').value || '';
            const nameSig3 = document.getElementById('name-sig-3').value || '';

            let sigImg1 = sigDrawn[1] ? sigDataUrl[1] : '';
            let sigImg2 = sigDrawn[2] ? sigDataUrl[2] : '';
            let sigImg3 = sigDrawn[3] ? sigDataUrl[3] : '';

            let linesHtml = '';
            if (description) {
                /* ĐÃ THÊM font-style: italic ĐỂ IN NGHIÊNG NỘI DUNG MÔ TẢ */
                linesHtml = `<div style="text-align: justify; line-height: 2.2; text-indent: 20px; font-style: italic;">${description.replace(/\n/g, '<br>')}</div>`;
            } else {
                for (let i = 0; i < 8; i++) {
                    linesHtml += `<div style="border-bottom: 1px dotted #000; height: 28px;"></div>`;
                }
            }

            const printContainer = document.getElementById('print-area');
            printContainer.innerHTML = `
                <div style="font-family: 'Times New Roman', Times, serif; color: #000; width: 100%; box-sizing: border-box; font-size: 13pt; line-height: 1.5; padding: 0 5mm;">
                    
                    <!-- Header Table -->
                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;" border="0">
                        <tr>
                            <td style="vertical-align: top; text-align: left; font-size: 11pt; color: #333;">
                                TCT HÀNG KHÔNG VIỆT NAM<br>
                                <b>CHI NHÁNH KHU VỰC VIỆT NAM</b>
                            </td>
                            <td style="vertical-align: top; text-align: right; font-size: 11pt; font-style: italic; color: #333;">
                                Mã Số: BM-CNVN-045<br>
                                Lần Ban Hành: 01
                            </td>
                        </tr>
                    </table>

                    <!-- Quốc hiệu & Tiêu đề -->
                    <div style="text-align: center; margin-bottom: 25px;">
                        <div style="font-weight: bold; font-size: 13pt;">CỘNG HOÀ XÃ HỘI CHỦ NGHĨA VIỆT NAM</div>
                        <div style="font-weight: bold; font-size: 13pt; margin-top: 2px;">
                            <span style="border-bottom: 1px solid #000; padding-bottom: 1px;">Độc lập - Tự do - Hạnh phúc</span>
                        </div>
                        <div style="font-size: 18pt; font-weight: bold; margin-top: 22px;">BIÊN BẢN BẤT THƯỜNG</div>
                    </div>

                    <!-- Nội dung thông tin -->
                    <div style="font-size: 13pt; line-height: 1.8;">
                        <div style="margin-bottom: 10px;">
                            Hôm nay, ngày <span style="border-bottom: 1px dotted #000; display: inline-block; min-width: 40px; text-align: center;">${day}</span> 
                            tháng <span style="border-bottom: 1px dotted #000; display: inline-block; min-width: 40px; text-align: center;">${month}</span> 
                            năm <span style="border-bottom: 1px dotted #000; display: inline-block; min-width: 45px; text-align: center;">${year}</span>, 
                            vào hồi <span style="border-bottom: 1px dotted #000; display: inline-block; min-width: 45px; text-align: center;">${hour}</span> 
                            giờ <span style="border-bottom: 1px dotted #000; display: inline-block; min-width: 40px; text-align: center;">${minute}</span>, 
                            tại: <span style="border-bottom: 1px dotted #000; display: inline-block; min-width: 200px;">${location}</span>
                        </div>

                        <div style="margin-top: 12px; margin-bottom: 8px;">Chúng tôi gồm:</div>

                        <div style="margin-left: 25px; margin-bottom: 6px; white-space: nowrap;">
                            1. Ông/Bà: <span style="border-bottom: 1px dotted #000; display: inline-block; width: 220px; text-align: center;">${p1}</span> 
                            Đại diện: <span style="border-bottom: 1px dotted #000; display: inline-block; width: 220px; text-align: center;">${r1}</span>
                        </div>
                        <div style="margin-left: 25px; margin-bottom: 6px; white-space: nowrap;">
                            2. Ông/Bà: <span style="border-bottom: 1px dotted #000; display: inline-block; width: 220px; text-align: center;">${p2}</span> 
                            Đại diện: <span style="border-bottom: 1px dotted #000; display: inline-block; width: 220px; text-align: center;">${r2}</span>
                        </div>
                        <div style="margin-left: 25px; margin-bottom: 6px; white-space: nowrap;">
                            3. Ông/Bà: <span style="border-bottom: 1px dotted #000; display: inline-block; width: 220px; text-align: center;">${p3}</span> 
                            Đại diện: <span style="border-bottom: 1px dotted #000; display: inline-block; width: 220px; text-align: center;">${r3}</span>
                        </div>

                        <div style="margin-top: 14px; margin-bottom: 10px;">Cùng nhau lập biên bản xác nhận sự việc sau:</div>

                        <div style="margin-bottom: 15px;">
                            ${linesHtml}
                        </div>

                        <div style="margin-top: 15px;">
                            Biên bản này được lập có sự chứng kiến và ký nhận của các bên liên quan.
                        </div>
                    </div>

                    <!-- Chữ ký 3 cột -->
                    <div style="margin-top: 30px; page-break-inside: avoid;">
                        <table style="width: 100%; border-collapse: collapse; text-align: center;" border="0">
                            <tr>
                                <td style="width: 33.33%; vertical-align: top; font-weight: bold; font-size: 10pt; white-space: nowrap; padding: 0 2px;">
                                    ĐẠI DIỆN VNA<br>
                                    <div style="height: 80px; display: flex; align-items: center; justify-content: center; margin: 5px 0;">
                                        ${sigImg1 ? `<img src="${sigImg1}" class="sig-print-img" style="max-height: 80px; max-width: 100%;">` : ''}
                                    </div>
                                    <span style="font-size: 11pt; font-weight: normal;">${nameSig1}</span>
                                </td>
                                <td style="width: 33.33%; vertical-align: top; font-weight: bold; font-size: 10pt; white-space: nowrap; padding: 0 2px;">
                                    ĐẠI DIỆN CÁC BÊN LIÊN QUAN<br>
                                    <div style="height: 80px; display: flex; align-items: center; justify-content: center; margin: 5px 0;">
                                        ${sigImg2 ? `<img src="${sigImg2}" class="sig-print-img" style="max-height: 80px; max-width: 100%;">` : ''}
                                    </div>
                                    <span style="font-size: 11pt; font-weight: normal;">${nameSig2}</span>
                                </td>
                                <td style="width: 33.33%; vertical-align: top; font-weight: bold; font-size: 10pt; white-space: nowrap; padding: 0 2px;">
                                    NGƯỜI LÀM CHỨNG<br>
                                    <div style="height: 80px; display: flex; align-items: center; justify-content: center; margin: 5px 0;">
                                        ${sigImg3 ? `<img src="${sigImg3}" class="sig-print-img" style="max-height: 80px; max-width: 100%;">` : ''}
                                    </div>
                                    <span style="font-size: 11pt; font-weight: normal;">${nameSig3}</span>
                                </td>
                            </tr>
                        </table>
                    </div>

                </div>
            `;

            const printImgs = printContainer.querySelectorAll('.sig-print-img');
            let loadedCount = 0;

            const triggerPrint = () => {
                setTimeout(() => {
                    try {
                        window.print();
                    } catch (e) {
                        alert("Trình duyệt không cho phép tự động mở hộp thoại in. Bạn vui lòng nhấn Ctrl + P để in/xuất PDF.");
                    }
                }, 150);
            };

            if (printImgs.length === 0) {
                triggerPrint();
            } else {
                printImgs.forEach(img => {
                    if (img.complete) {
                        loadedCount++;
                        if (loadedCount === printImgs.length) triggerPrint();
                    } else {
                        img.onload = () => {
                            loadedCount++;
                            if (loadedCount === printImgs.length) triggerPrint();
                        };
                        img.onerror = () => {
                            loadedCount++;
                            if (loadedCount === printImgs.length) triggerPrint();
                        };
                    }
                });
            }
        }

        window.onload = function() {
            loadData();
        };
    </script>
</body>
</html>
