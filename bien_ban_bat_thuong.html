<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BIÊN BẢN BẤT THƯỜNG</title>

    <!-- Icon / Favicon -->
    <link rel="icon" type="image/png" href="https://votrungdung17-hue.github.io/fastandsmile.github.io/BBVV.png">
    <link rel="apple-touch-icon" href="https://votrungdung17-hue.github.io/fastandsmile.github.io/BBVV.png">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #1f2937;
            line-height: 1.4;
            padding-bottom: 90px;
        }

        .header-bar {
            background-color: #0056b3;
            color: #ffffff;
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-bar h1 {
            font-size: 15px;
            font-weight: 700;
        }

        .save-status {
            font-size: 11px;
            background: rgba(255,255,255,0.2);
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 500;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 12px;
        }

        .document-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            margin-bottom: 16px;
        }

        /* Header logo/tên công ty */
        .org-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 12px;
            color: #374151;
            padding-bottom: 12px;
            border-bottom: 1px dashed #e5e7eb;
            margin-bottom: 12px;
        }

        .org-name {
            font-weight: bold;
            text-transform: uppercase;
            line-height: 1.3;
            color: #0054a6;
        }

        .doc-title {
            text-align: center;
            color: #0056b3;
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            margin: 15px 0 16px 0;
            line-height: 1.3;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: #0056b3;
            margin-top: 15px;
            margin-bottom: 10px;
            border-left: 3px solid #0056b3;
            padding-left: 8px;
            text-transform: uppercase;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .meta-grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        @media (max-width: 600px) {
            .meta-grid, .meta-grid-3 {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 4px;
        }

        .form-group input, .form-group select {
            padding: 8px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            background-color: #fff;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #0056b3;
            box-shadow: 0 0 0 2px rgba(0, 86, 179, 0.15);
        }

        .input-uppercase {
            text-transform: uppercase;
        }

        .note-box {
            margin-top: 12px;
            background: #ffffff;
            border: 1px solid #d1d5db;
            padding: 12px;
            border-radius: 6px;
        }

        .note-box label {
            font-size: 12px;
            font-weight: 700;
            color: #374151;
            display: block;
            margin-bottom: 6px;
        }

        .note-box textarea {
            width: 100%;
            height: 90px;
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 13px;
            resize: vertical;
            outline: none;
        }

        .signature-section {
            margin-top: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 600px) {
            .signature-section {
                grid-template-columns: 1fr;
            }
        }

        .sig-box {
            border: 1px dashed #9ca3af;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            background: #fafafa;
        }

        .sig-title {
            font-size: 13px;
            font-weight: 700;
            color: #374151;
            margin-bottom: 8px;
        }

        .sig-canvas-wrap {
            position: relative;
            width: 100%;
            height: 120px;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            margin-bottom: 8px;
            touch-action: none;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .sig-name-input {
            width: 100%;
            padding: 6px 10px;
            font-size: 12px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            margin-bottom: 8px;
            text-align: center;
            font-weight: 600;
            text-transform: uppercase;
        }

        .sig-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 11px;
            border-radius: 4px;
            border: 1px solid #d1d5db;
            cursor: pointer;
            background: #ffffff;
            color: #374151;
            font-weight: 600;
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #e5e7eb;
            padding: 10px 16px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .btn-primary {
            flex: 1;
            background: #0056b3;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #d1d5db;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        #print-area {
            display: none;
        }

        @media print {
            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            
            .header-bar, .container, .bottom-bar {
                display: none !important;
            }

            #print-area {
                display: block !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }

            @page {
                size: A4 portrait;
                margin: 12mm 15mm;
            }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>BIÊN BẢN BẤT THƯỜNG</h1>
        <span class="save-status" id="save-status">✓ Đã tự động lưu</span>
    </div>

    <div class="container">
        <div class="document-card">
            
            <div class="org-header">
                <div class="org-name">
                    TCT HÀNG KHÔNG VIỆT NAM<br>
                    CHI NHÁNH KHU VỰC VIỆT NAM
                </div>
            </div>

            <div class="doc-title">BIÊN BẢN BẤT THƯỜNG</div>

            <div class="section-title">THÔNG TIN CHUYẾN BAY & ĐỊA ĐIỂM</div>
            <div class="meta-grid-3">
                <div class="form-group">
                    <label>Số hiệu chuyến bay:</label>
                    <input type="text" id="flight-input" class="input-uppercase" placeholder="VD: VN123" oninput="saveData()">
                </div>
                <div class="form-group">
                    <label>Ngày bay:</label>
                    <input type="date" id="date-input" oninput="saveData()">
                </div>
                <div class="form-group">
                    <label>Hành trình / Chặng bay:</label>
                    <input type="text" id="route-input" class="input-uppercase" placeholder="VD: SGN-HAN" oninput="saveData()">
                </div>
            </div>

            <div class="meta-grid">
                <div class="form-group">
                    <label>Thời gian phát hiện / Xảy ra:</label>
                    <input type="time" id="time-input" oninput="saveData()">
                </div>
                <div class="form-group">
                    <label>Địa điểm xảy ra sự cố:</label>
                    <input type="text" id="location-input" placeholder="VD: Sân đỗ / Cửa khởi hành / Trên tàu bay" oninput="saveData()">
                </div>
            </div>

            <div class="section-title">PHÂN LOẠI SỰ CỐ / BẤT THƯỜNG</div>
            <div class="meta-grid">
                <div class="form-group">
                    <label>Loại bất thường:</label>
                    <select id="type-input" onchange="saveData()">
                        <option value="Hành khách / Hành lý">Hành khách / Hành lý</option>
                        <option value="Hàng hóa / Bưu gửi">Hàng hóa / Bưu gửi</option>
                        <option value="An ninh / An toàn">An ninh / An toàn hàng không</option>
                        <option value="Kỹ thuật / Tàu bay">Kỹ thuật / Tàu bay</option>
                        <option value="Khác">Khác</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Đối tượng liên quan:</label>
                    <input type="text" id="subject-input" class="input-uppercase" placeholder="VD: Hành khách A / Thùng hàng X" oninput="saveData()">
                </div>
            </div>

            <div class="section-title">NỘI DUNG SỰ VIỆC & BIỆN PHÁP XỬ LÝ</div>
            <div class="note-box">
                <label>Mô tả chi tiết sự việc bất thường:</label>
                <textarea id="description-input" placeholder="Nhập chi tiết diễn biến sự việc bất thường xảy ra..." oninput="saveData()"></textarea>
            </div>

            <div class="note-box">
                <label>Biện pháp xử lý đã áp dụng & Tình trạng hiện tại:</label>
                <textarea id="action-input" placeholder="Nhập các biện pháp đã xử lý tại chỗ, tình trạng sau xử lý..." oninput="saveData()"></textarea>
            </div>

            <div class="signature-section">
                <div class="sig-box">
                    <div class="sig-title">NGƯỜI LẬP BIÊN BẢN</div>
                    <div class="sig-canvas-wrap" id="wrap-sig-1">
                        <canvas id="canvas-sig-1"></canvas>
                    </div>
                    <input type="text" class="sig-name-input" id="name-sig-1" placeholder="Họ và tên..." oninput="saveData()">
                    <div class="sig-actions">
                        <button class="btn-sm" onclick="clearSignature(1)">Xóa / Ký lại</button>
                        <span id="sig-status-1" style="font-size: 11px; font-weight: bold; color: #10b981;"></span>
                    </div>
                </div>

                <div class="sig-box">
                    <div class="sig-title">ĐẠI DIỆN BÊN LIÊN QUAN / XÁC NHẬN</div>
                    <div class="sig-canvas-wrap" id="wrap-sig-2">
                        <canvas id="canvas-sig-2"></canvas>
                    </div>
                    <input type="text" class="sig-name-input" id="name-sig-2" placeholder="Họ và tên..." oninput="saveData()">
                    <div class="sig-actions">
                        <button class="btn-sm" onclick="clearSignature(2)">Xóa / Ký lại</button>
                        <span id="sig-status-2" style="font-size: 11px; font-weight: bold; color: #10b981;"></span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="bottom-bar">
        <button class="btn-secondary" onclick="resetForm()">Làm mới</button>
        <button class="btn-primary" onclick="exportToPDF()">Xuất PDF / In</button>
    </div>

    <div id="print-area"></div>

    <script>
        const STORAGE_KEY = 'bien_ban_bat_thuong_data_v1';

        let sigDrawn1 = false;
        let sigDataUrl1 = '';
        let sigDrawn2 = false;
        let sigDataUrl2 = '';

        document.getElementById('date-input').valueAsDate = new Date();

        function saveData() {
            const dataToSave = {
                flight: document.getElementById('flight-input').value,
                date: document.getElementById('date-input').value,
                route: document.getElementById('route-input').value,
                time: document.getElementById('time-input').value,
                location: document.getElementById('location-input').value,
                type: document.getElementById('type-input').value,
                subject: document.getElementById('subject-input').value,
                description: document.getElementById('description-input').value,
                action: document.getElementById('action-input').value,
                nameSig1: document.getElementById('name-sig-1').value,
                nameSig2: document.getElementById('name-sig-2').value,
                sigDataUrl1: sigDrawn1 ? document.getElementById('canvas-sig-1').toDataURL('image/png') : '',
                sigDataUrl2: sigDrawn2 ? document.getElementById('canvas-sig-2').toDataURL('image/png') : ''
            };

            localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
            
            const statusEl = document.getElementById('save-status');
            statusEl.innerText = "✓ Đã tự động lưu";
            statusEl.style.opacity = "1";
        }

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) return;

            try {
                const parsed = JSON.parse(saved);
                if (parsed.flight !== undefined) document.getElementById('flight-input').value = parsed.flight;
                if (parsed.date !== undefined && parsed.date !== '') document.getElementById('date-input').value = parsed.date;
                if (parsed.route !== undefined) document.getElementById('route-input').value = parsed.route;
                if (parsed.time !== undefined) document.getElementById('time-input').value = parsed.time;
                if (parsed.location !== undefined) document.getElementById('location-input').value = parsed.location;
                if (parsed.type !== undefined) document.getElementById('type-input').value = parsed.type;
                if (parsed.subject !== undefined) document.getElementById('subject-input').value = parsed.subject;
                if (parsed.description !== undefined) document.getElementById('description-input').value = parsed.description;
                if (parsed.action !== undefined) document.getElementById('action-input').value = parsed.action;
                if (parsed.nameSig1 !== undefined) document.getElementById('name-sig-1').value = parsed.nameSig1;
                if (parsed.nameSig2 !== undefined) document.getElementById('name-sig-2').value = parsed.nameSig2;

                if (parsed.sigDataUrl1) {
                    sigDataUrl1 = parsed.sigDataUrl1;
                    sigDrawn1 = true;
                    loadSignatureToCanvas(1, parsed.sigDataUrl1);
                }
                if (parsed.sigDataUrl2) {
                    sigDataUrl2 = parsed.sigDataUrl2;
                    sigDrawn2 = true;
                    loadSignatureToCanvas(2, parsed.sigDataUrl2);
                }
            } catch (e) {
                console.error("Lỗi khôi phục dữ liệu:", e);
            }
        }

        function loadSignatureToCanvas(id, dataUrl) {
            const canvas = document.getElementById(`canvas-sig-${id}`);
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.onload = function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                document.getElementById(`sig-status-${id}`).innerText = "✓ Đã ký";
            };
            img.src = dataUrl;
        }

        function initSignatureCanvas(id) {
            const canvas = document.getElementById(`canvas-sig-${id}`);
            const wrap = document.getElementById(`wrap-sig-${id}`);
            const ctx = canvas.getContext('2d');
            let isDrawing = false;

            function resize() {
                const rect = wrap.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#002b66';

                if (id === 1 && sigDataUrl1) loadSignatureToCanvas(1, sigDataUrl1);
                if (id === 2 && sigDataUrl2) loadSignatureToCanvas(2, sigDataUrl2);
            }

            window.addEventListener('resize', resize);
            setTimeout(resize, 200);

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            function start(e) {
                isDrawing = true;
                if (id === 1) sigDrawn1 = true;
                if (id === 2) sigDrawn2 = true;
                const p = getPos(e);
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
            }

            function move(e) {
                if (!isDrawing) return;
                e.preventDefault();
                const p = getPos(e);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
            }

            function stop() {
                if (isDrawing) {
                    isDrawing = false;
                    const dataUrl = canvas.toDataURL('image/png');
                    if (id === 1) sigDataUrl1 = dataUrl;
                    if (id === 2) sigDataUrl2 = dataUrl;
                    document.getElementById(`sig-status-${id}`).innerText = "✓ Đã ký";
                    saveData();
                }
            }

            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', move);
            canvas.addEventListener('mouseup', stop);

            canvas.addEventListener('touchstart', start, { passive: false });
            canvas.addEventListener('touchmove', move, { passive: false });
            canvas.addEventListener('touchend', stop);
        }

        initSignatureCanvas(1);
        initSignatureCanvas(2);

        function clearSignature(id) {
            const canvas = document.getElementById(`canvas-sig-${id}`);
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById(`name-sig-${id}`).value = '';
            if (id === 1) { sigDrawn1 = false; sigDataUrl1 = ''; }
            if (id === 2) { sigDrawn2 = false; sigDataUrl2 = ''; }
            document.getElementById(`sig-status-${id}`).innerText = "";
            saveData();
        }

        function resetForm() {
            if (confirm("Làm mới sẽ XÓA HẾT toàn bộ dữ liệu đã lưu. Bạn có chắc chắn không?")) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }

        function formatDate(dateStr) {
            if(!dateStr) return '……………………..…..';
            const parts = dateStr.split('-');
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }

        function exportToPDF() {
            const flight = document.getElementById('flight-input').value || '………..……….....…';
            const date = formatDate(document.getElementById('date-input').value);
            const route = document.getElementById('route-input').value || '………..……….....…';
            const time = document.getElementById('time-input').value || '………..……';
            const location = document.getElementById('location-input').value || '………..……….....…';
            const type = document.getElementById('type-input').value || '';
            const subject = document.getElementById('subject-input').value || '………..……….....…';
            const description = document.getElementById('description-input').value || '';
            const action = document.getElementById('action-input').value || '';
            const nameSig1 = document.getElementById('name-sig-1').value || '';
            const nameSig2 = document.getElementById('name-sig-2').value || '';

            let sigImgSrc1 = sigDrawn1 ? document.getElementById('canvas-sig-1').toDataURL('image/png') : '';
            let sigImgSrc2 = sigDrawn2 ? document.getElementById('canvas-sig-2').toDataURL('image/png') : '';

            const printContainer = document.getElementById('print-area');
            printContainer.innerHTML = `
                <div style="font-family: 'Times New Roman', Times, serif; color: #000; width: 100%; box-sizing: border-box; font-size: 11pt; line-height: 1.4;">
                    
                    <div style="margin-bottom: 10px;">
                        <span style="color: #0054a6; font-weight: bold; font-size: 11pt; text-transform: uppercase;">TCT HÀNG KHÔNG VIỆT NAM<br>CHI NHÁNH KHU VỰC VIỆT NAM</span>
                    </div>

                    <div style="text-align: center; font-weight: bold; font-size: 14pt; margin-top: 15px; margin-bottom: 15px; text-transform: uppercase;">
                        BIÊN BẢN BẤT THƯỜNG
                    </div>

                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 15px;" border="0">
                        <tr>
                            <td style="padding: 4px 0; width: 33%;">Số hiệu chuyến bay: <b>${flight}</b></td>
                            <td style="padding: 4px 0; width: 33%;">Ngày bay: <b>${date}</b></td>
                            <td style="padding: 4px 0; width: 34%;">Hành trình: <b>${route}</b></td>
                        </tr>
                        <tr>
                            <td style="padding: 4px 0;">Thời gian: <b>${time}</b></td>
                            <td style="padding: 4px 0;" colspan="2">Địa điểm xảy ra: <b>${location}</b></td>
                        </tr>
                        <tr>
                            <td style="padding: 4px 0;">Phân loại: <b>${type}</b></td>
                            <td style="padding: 4px 0;" colspan="2">Đối tượng liên quan: <b>${subject}</b></td>
                        </tr>
                    </table>

                    <div style="margin-top: 10px; margin-bottom: 15px;">
                        <div style="font-weight: bold; text-transform: uppercase; margin-bottom: 5px;">1. Mô tả nội dung sự việc:</div>
                        <div style="min-height: 120px; border: 1px solid #000; padding: 8px; font-style: normal; white-space: pre-line;">${description}</div>
                    </div>

                    <div style="margin-top: 10px; margin-bottom: 20px;">
                        <div style="font-weight: bold; text-transform: uppercase; margin-bottom: 5px;">2. Biện pháp xử lý & Tình trạng hiện tại:</div>
                        <div style="min-height: 100px; border: 1px solid #000; padding: 8px; font-style: normal; white-space: pre-line;">${action}</div>
                    </div>

                    <div style="margin-top: 30px; display: flex; justify-content: space-between; text-align: center; font-size: 11pt; page-break-inside: avoid;">
                        <div style="width: 45%;">
                            <b>ĐẠI DIỆN BÊN LIÊN QUAN</b><br>
                            ${sigImgSrc2 ? `<img src="${sigImgSrc2}" style="max-height: 60px; max-width: 100%; margin-top: 8px;"><br>` : '<div style="height:60px;"></div>'}
                            <span style="font-size: 10pt; font-style: italic;">${nameSig2}</span>
                        </div>
                        <div style="width: 45%;">
                            <b>NGƯỜI LẬP BIÊN BẢN</b><br>
                            ${sigImgSrc1 ? `<img src="${sigImgSrc1}" style="max-height: 60px; max-width: 100%; margin-top: 8px;"><br>` : '<div style="height:60px;"></div>'}
                            <span style="font-size: 10pt; font-style: italic;">${nameSig1}</span>
                        </div>
                    </div>
                </div>
            `;

            try {
                window.print();
            } catch (e) {
                alert("Trình duyệt không cho phép tự động mở hộp thoại in. Bạn vui lòng nhấn tổ hợp phím Ctrl + P (hoặc Cmd + P trên Mac) để in/xuất PDF.");
            }
        }

        window.onload = function() {
            loadData();
        };
    </script>
</body>
