            { id: 24, category: "Giải trí", title: "Báo và tạp chí", standard: "Khuyến khích báo tạp chí địa phương" },
            { id: 25, category: "Hình ảnh VNA", title: "Dummy Girl trước cửa PKTG, mô hình máy bay, tạp chí Heritage, Fashion", standard: "Đảm bảo hình ảnh và nhận diện thương hiệu VNA" },
            { id: 26, category: "TC nhân viên", title: "Tiêu chuẩn ngoại ngữ, kỹ năng phục vụ, kỹ năng quan hệ khách hàng", standard: "Đạt tiêu chuẩn theo HĐPV PKTG" }
        ];

        const state = {};
        const sigDrawn = { sig1: false, sig2: false };

        const container = document.getElementById('checklist-container');
        rawData.forEach(item => {
            if (item.section) {
                const secEl = document.createElement('div');
                secEl.className = 'section-title';
                secEl.innerText = item.section;
                container.appendChild(secEl);
            } else {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.id = `item-card-${item.id}`;
                
                const catTag = item.category ? `<span style="font-size: 11px; background: #e0f2fe; color: #0369a1; padding: 2px 6px; border-radius: 4px; font-weight: 600;">${item.category}</span>` : '';
                
                card.innerHTML = `
                    <div class="item-header">
                        <span class="item-no">${String(item.id).padStart(2, '0')}</span>
                        <div class="item-title">${item.title}</div>
                        ${catTag}
                    </div>
                    <div class="item-standard"><strong>Tiêu chuẩn:</strong> ${item.standard.replace(/\n/g, '<br>')}</div>
                    <div class="status-options">
                        <button type="button" class="opt-btn pass-btn" onclick="setStatus(${item.id}, 'pass')">
                            ✓ Đạt
                        </button>
                        <button type="button" class="opt-btn fail-btn" onclick="setStatus(${item.id}, 'fail')">
                            ✗ Không Đạt
                        </button>
                        <button type="button" class="opt-btn na-btn" onclick="setStatus(${item.id}, 'na')">
                            — K.Áp Dụng
                        </button>
                    </div>
                    <input type="text" class="note-input" id="note-${item.id}" placeholder="Ghi chú thêm...">
                `;
                container.appendChild(card);
            }
        });

        function setStatus(id, val) {
            state[id] = val;
            const card = document.getElementById(`item-card-${id}`);
            const passBtn = card.querySelector('.pass-btn');
            const failBtn = card.querySelector('.fail-btn');
            const naBtn = card.querySelector('.na-btn');

            card.classList.remove('checked-pass', 'checked-fail', 'checked-na');
            passBtn.classList.remove('active');
            failBtn.classList.remove('active');
            naBtn.classList.remove('active');

            if (val === 'pass') {
                card.classList.add('checked-pass');
                passBtn.classList.add('active');
            } else if (val === 'fail') {
                card.classList.add('checked-fail');
                failBtn.classList.add('active');
            } else if (val === 'na') {
                card.classList.add('checked-na');
                naBtn.classList.add('active');
            }
        }

        function initSignatureCanvas(id) {
            const canvas = document.getElementById(`canvas-${id}`);
            const wrap = document.getElementById(`wrap-${id}`);
            const ctx = canvas.getContext('2d');
            let isDrawing = false;

            function resize() {
                const rect = wrap.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#002b66';
            }

            window.addEventListener('resize', resize);
            setTimeout(resize, 200);

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            function start(e) {
                isDrawing = true;
                sigDrawn[id] = true;
                const p = getPos(e);
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
            }

            function move(e) {
                if (!isDrawing) return;
                e.preventDefault();
                const p = getPos(e);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
            }

            function stop() {
                if (isDrawing) {
                    isDrawing = false;
                    document.getElementById(`${id}-status`).innerText = "✓ Đã ký";
                }
            }

            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', move);
            canvas.addEventListener('mouseup', stop);

            canvas.addEventListener('touchstart', start, { passive: false });
            canvas.addEventListener('touchmove', move, { passive: false });
            canvas.addEventListener('touchend', stop);
        }

        initSignatureCanvas('sig1');
        initSignatureCanvas('sig2');

        function clearSignature(id) {
            const canvas = document.getElementById(`canvas-${id}`);
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById(`name-${id}`).value = '';
            sigDrawn[id] = false;
            document.getElementById(`${id}-status`).innerText = "";
        }

                    <td class="text-center">${state[2] === 'pass' ? '<b>X</b>' : ''}</td>
                    <td class="text-center">${state[2] === 'fail' ? '<b>X</b>' : ''}</td>
