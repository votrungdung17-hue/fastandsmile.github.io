            { id: 3, category: "", title: "Bản thông tin chuyến bay", standard: "Thông tin chuyến bay được cập nhật theo đúng tình trạng chuyến bay" },
            { id: 4, category: "", title: "Trang trí theo chủ đề", standard: "Xác định chủ đề trang trí phù hợp với văn hóa địa phương tạo không gian thư giãn. Có trang trí theo chủ đề Lễ, Tết" },
            { id: 5, category: "", title: "Khu vực yên tĩnh, thư giãn", standard: "Khuyến khích" },

            { section: "II. SUẤT ĂN" },
            { id: 6, category: "Suất ăn", title: "Món ăn nhẹ", standard: "3-4 lựa chọn" },
            { id: 7, category: "Suất ăn", title: "Bánh mì và bánh ngọt", standard: "3-4 lựa chọn" },
            { id: 8, category: "Suất ăn", title: "Lựa chọn ăn uống có lợi cho sức khỏe", standard: "Khuyến khích" },
            { id: 9, category: "Suất ăn", title: "Tráng miệng", standard: "Khuyến khích" },
            { id: 10, category: "Suất ăn", title: "Các món phục vụ trong khung giờ bữa chính", standard: "Món nóng: 1 lựa chọn mì hoặc phở ăn liền với nước dùng hầm xương có thêm thịt, trứng hoặc cá và buffet tùy từng phòng C" },
            { id: 11, category: "Suất ăn", title: "Các loại gia vị", standard: "Có" },
            { id: 12, category: "Suất ăn", title: "Tiêu chuẩn thực đơn đồ uống & đặc sản", standard: "Chú trọng các thực đơn đồ uống theo hướng nhấn vào đồ uống địa phương, các chủng loại café, đồ uống có lợi cho sức khỏe. Phục vụ kèm theo các đồ ăn nhẹ, ưu tiên các sản vật địa phương được phục vụ phù hợp với tiêu chuẩn khách hạng Thương gia và đảm bảo sự tươi mới chất lượng" },

            { section: "III. ĐỒ UỐNG" },
            { id: 13, category: "Đồ uống", title: "Trà", standard: "2 lựa chọn" },
            { id: 14, category: "Đồ uống", title: "Café", standard: "3 lựa chọn" },
            { id: 15, category: "Đồ uống", title: "Nước ngọt", standard: "2 lựa chọn" },
            { id: 16, category: "Đồ uống", title: "Nước tinh khiết", standard: "1-2 lựa chọn" },
            { id: 17, category: "Đồ uống", title: "Nước trái cây", standard: "2 lựa chọn" },

            { section: "IV. GIẢI TRÍ & CÔNG TÁC PHỤC VỤ" },
            { id: 18, category: "Giải trí", title: "Báo và tạp chí", standard: "Khuyến khích báo tạp chí địa phương" },
            { id: 19, category: "Công tác phục vụ", title: "Kiểm tra vệ sinh & Nhân sự", standard: "- Thực hiện kiểm tra vệ sinh hàng ngày, Checklist kiểm tra phòng vệ sinh, Nhân viên phục vụ theo checklist.\n- Lấy mẫu thực phẩm đầu ngày, lưu giữ trong vòng 24 tiếng.\n- Bố trí đủ nhân sự (lễ tân, nhân viên phục vụ, nhân viên vệ sinh, phụ trách ca trực)." },
            { id: 20, category: "Công tác phục vụ", title: "Bổ sung thực phẩm", standard: "Đảm bảo thức ăn đồ uống đầy đủ các thời điểm phục vụ nhiều chuyến bay cùng khung giờ, các chuyến bay cuối ngày." }
        ];

        const state = {};
        const sigDrawn = { sig1: false, sig2: false };

        document.getElementById('date-input').valueAsDate = new Date();

        const container = document.getElementById('checklist-container');
        rawData.forEach(item => {
            if (item.section) {
                const secEl = document.createElement('div');
                secEl.className = 'section-title';
                secEl.innerText = item.section;
                container.appendChild(secEl);
            } else {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.id = `item-card-${item.id}`;
                
                const catTag = item.category ? `<span style="font-size: 11px; background: #e0f2fe; color: #0369a1; padding: 2px 6px; border-radius: 4px; font-weight: 600;">${item.category}</span>` : '';
                
                card.innerHTML = `
                    <div class="item-header">
                        <span class="item-no">${String(item.id).padStart(2, '0')}</span>
                        <div class="item-title">${item.title}</div>
                        ${catTag}
                    </div>
                    <div class="item-standard"><strong>Tiêu chuẩn:</strong> ${item.standard.replace(/\n/g, '<br>')}</div>
                    <div class="status-options">
                        <button type="button" class="opt-btn pass-btn" onclick="setStatus(${item.id}, 'pass')">
                            ✓ Đạt
                        </button>
                        <button type="button" class="opt-btn fail-btn" onclick="setStatus(${item.id}, 'fail')">
                            ✗ Không Đạt
                        </button>
                        <button type="button" class="opt-btn na-btn" onclick="setStatus(${item.id}, 'na')">
                            — K.Áp Dụng
                        </button>
                    </div>
                    <input type="text" class="note-input" id="note-${item.id}" placeholder="Ghi chú thêm...">
                `;
                container.appendChild(card);
            }
        });

        function setStatus(id, val) {
            state[id] = val;
            const card = document.getElementById(`item-card-${id}`);
            const passBtn = card.querySelector('.pass-btn');
            const failBtn = card.querySelector('.fail-btn');
            const naBtn = card.querySelector('.na-btn');

            card.classList.remove('checked-pass', 'checked-fail', 'checked-na');
            passBtn.classList.remove('active');
            failBtn.classList.remove('active');
            naBtn.classList.remove('active');

            if (val === 'pass') {
                card.classList.add('checked-pass');
                passBtn.classList.add('active');
            } else if (val === 'fail') {
                card.classList.add('checked-fail');
                failBtn.classList.add('active');
            } else if (val === 'na') {
                card.classList.add('checked-na');
                naBtn.classList.add('active');
            }
        }

        function initSignatureCanvas(id) {
            const canvas = document.getElementById(`canvas-${id}`);
            const wrap = document.getElementById(`wrap-${id}`);
            const ctx = canvas.getContext('2d');
            let isDrawing = false;

            function resize() {
                const rect = wrap.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#002b66';
            }

            window.addEventListener('resize', resize);
            setTimeout(resize, 200);

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            function start(e) {
                isDrawing = true;
                sigDrawn[id] = true;
                const p = getPos(e);
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
            }

            function move(e) {
                if (!isDrawing) return;
                e.preventDefault();
                const p = getPos(e);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
            }

            function stop() {
                if (isDrawing) {
                    isDrawing = false;
                    document.getElementById(`${id}-status`).innerText = "✓ Đã ký";
                }
            }

            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', move);
            canvas.addEventListener('mouseup', stop);

            canvas.addEventListener('touchstart', start, { passive: false });
            canvas.addEventListener('touchmove', move, { passive: false });
            canvas.addEventListener('touchend', stop);
        }

        initSignatureCanvas('sig1');
        initSignatureCanvas('sig2');

        function clearSignature(id) {
            const canvas = document.getElementById(`canvas-${id}`);
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById(`name-${id}`).value = '';
            sigDrawn[id] = false;
            document.getElementById(`${id}-status`).innerText = "";
        }

            if (confirm("Làm mới toàn bộ bảng kiểm tra?")) location.reload();

        function exportToPDF() {

            let tableRowsHTML = `

                    <td class="text-center">${state[2] === 'pass' ? '<b>X</b>' : ''}</td>
                    <td class="text-center">${state[2] === 'fail' ? '<b>X</b>' : ''}</td>
                    <td class="text-center">${state[2] === 'na' ? '<b>X</b>' : ''}</td>
                </tr>
                <tr>
                    <td class="text-center">3</td>
                    <td></td>
