<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHECK-LIST KIỂM SOÁT CHẤT LƯỢNG DỊCH VỤ HÀNG HÓA (BM-CNVN-060)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #1f2937;
            line-height: 1.3;
            padding-bottom: 90px;
        }

        .header-bar {
            background-color: #0056b3;
            color: #ffffff;
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-bar h1 {
            font-size: 16px;
            font-weight: 700;
        }

        .header-bar .doc-code {
            font-size: 12px;
            background: rgba(255,255,255,0.2);
            padding: 3px 8px;
            border-radius: 12px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 12px;
        }

        .document-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            margin-bottom: 16px;
        }

        .doc-header {
            border-bottom: 2px solid #0056b3;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .doc-header-top {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: bold;
            color: #4b5563;
            margin-bottom: 6px;
        }

        .doc-title {
            text-align: center;
            color: #0056b3;
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            margin: 10px 0;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        @media (max-width: 480px) {
            .meta-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 4px;
        }

        .form-group input {
            padding: 8px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .section-title {
            background: #eef6ff;
            color: #0056b3;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 700;
            border-left: 4px solid #0056b3;
            margin: 16px 0 10px 0;
            border-radius: 0 4px 4px 0;
        }

        .item-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .item-card.checked-true {
            border-left: 4px solid #10b981;
            background-color: #f0fdf4;
        }

        .item-card.checked-false {
            border-left: 4px solid #ef4444;
            background-color: #fef2f2;
        }

        .item-card.checked-na {
            border-left: 4px solid #6b7280;
            background-color: #f3f4f6;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 8px;
        }

        .item-no {
            background: #6b7280;
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            min-width: 24px;
            text-align: center;
        }

        .item-text {
            font-size: 13px;
            font-weight: 600;
            color: #1f2937;
            flex-grow: 1;
        }

        .item-unit {
            font-size: 11px;
            color: #6b7280;
            background: #f3f4f6;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .status-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-bottom: 8px;
        }

        .opt-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 4px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            background: white;
            color: #4b5563;
        }

        .opt-btn.pass-btn.active { background: #10b981; color: white; border-color: #059669; }
        .opt-btn.fail-btn.active { background: #ef4444; color: white; border-color: #dc2626; }
        .opt-btn.na-btn.active { background: #6b7280; color: white; border-color: #4b5563; }

        .note-input {
            width: 100%;
            padding: 6px 10px;
            font-size: 12px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
        }

        /* KHU VỰC CHỮ KÝ: RESPONSIVE DỌC TRÊN ĐIỆN THOẠI, NGANG TRÊN MÁY TÍNH */
        .signature-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 20px;
        }

        @media (min-width: 640px) {
            .signature-section {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
            }
        }

        .sig-box {
            border: 1px dashed #9ca3af;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            background: #fafafa;
            width: 100%;
        }

        .sig-title {
            font-size: 13px;
            font-weight: 700;
            color: #374151;
            margin-bottom: 10px;
        }

        .sig-canvas-wrap {
            position: relative;
            width: 100%;
            height: 160px; /* Tăng kích thước ô ký tay rộng rãi trên điện thoại */
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            margin-bottom: 8px;
            touch-action: none;
        }

        @media (min-width: 640px) {
            .sig-canvas-wrap {
                height: 130px;
            }
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .sig-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 4px;
            border: 1px solid #d1d5db;
            cursor: pointer;
            background: #ffffff;
            color: #374151;
            font-weight: 600;
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #e5e7eb;
            padding: 10px 16px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .btn-primary {
            flex: 1;
            background: #0056b3;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #d1d5db;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        #print-area {
            display: none;
        }

        /* IN TRANG A4 VẪN ĐẢM BẢO KHÍT 1 TRANG */
        @media print {
            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            
            .header-bar, .container, .bottom-bar {
                display: none !important;
            }

            #print-area {
                display: block !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }

            @page {
                size: A4 portrait;
                margin: 6mm 8mm 6mm 8mm;
            }
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <h1>VNA CARGO CHECKLIST</h1>
        <span class="doc-code">BM-CNVN-060</span>
    </div>

    <div class="container">
        <div class="document-card">
            
            <div class="doc-header">
                <div class="doc-header-top">
                    <span>TỔNG CÔNG TY HÀNG KHÔNG VIỆT NAM - CTCP<br>CHI NHÁNH KHU VỰC VIỆT NAM</span>
                    <span style="text-align: right;">Mã số: BM-CNVN-060<br>Lần ban hành: 2</span>
                </div>
                <div class="doc-title">CHECK-LIST KIỂM SOÁT CHẤT LƯỢNG DỊCH VỤ HÀNG HÓA</div>
            </div>

            <div class="meta-grid">
                <div class="form-group">
                    <label>Chi nhánh:</label>
                    <input type="text" id="cn-input" placeholder="Nhập tên chi nhánh...">
                </div>
                <div class="form-group">
                    <label>Số hiệu chuyến bay:</label>
                    <input type="text" id="flight-input" placeholder="VD: VN123">
                </div>
                <div class="form-group">
                    <label>Ngày kiểm tra:</label>
                    <input type="date" id="date-input">
                </div>
                <div class="form-group">
                    <label>Người kiểm soát:</label>
                    <input type="text" id="inspector-input" placeholder="Tên người kiểm soát">
                </div>
            </div>

            <div id="checklist-container"></div>

            <div class="signature-section">
                <div class="sig-box">
                    <div class="sig-title">CÔNG TY PHỤC VỤ (KÝ TAY DƯỚI ĐÂY)</div>
                    <div class="sig-canvas-wrap" id="wrap-sig1">
                        <canvas id="canvas-sig1"></canvas>
                    </div>
                    <div class="sig-actions">
                        <button class="btn-sm" onclick="clearSignature('sig1')">Xóa / Ký lại</button>
                        <span id="sig1-status" style="font-size: 11px; font-weight: bold; color: #10b981;"></span>
                    </div>
                </div>

                <div class="sig-box">
                    <div class="sig-title">ĐẠI DIỆN VNA (KÝ TAY DƯỚI ĐÂY)</div>
                    <div class="sig-canvas-wrap" id="wrap-sig2">
                        <canvas id="canvas-sig2"></canvas>
                    </div>
                    <div class="sig-actions">
                        <button class="btn-sm" onclick="clearSignature('sig2')">Xóa / Ký lại</button>
                        <span id="sig2-status" style="font-size: 11px; font-weight: bold; color: #10b981;"></span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="bottom-bar">
        <button class="btn-secondary" onclick="resetForm()">Làm mới</button>
        <button class="btn-primary" onclick="exportToPDF()">Xuất PDF</button>
    </div>

    <div id="print-area"></div>

    <script>
        const rawData = [
            { section: "A. Chỉ số chung" },
            { id: 1, text: "Chuyến bay đi đúng giờ (chỉ tính nguyên nhân chậm giờ do lỗi của công ty phục vụ)", unit: "C/bay" },
            
            { section: "B. Phục vụ hàng hóa, bưu kiện xuất" },
            { id: 2, text: "Hàng hoá được tiếp nhận theo đúng kế hoạch về thời gian nhận hàng (Chuẩn bị mâm thùng, nhân viên tiếp nhận, nhân viên hướng dẫn chất xếp và bốc xếp, nhân viên an ninh soi chiếu).", unit: "C/bay" },
            { id: 3, text: "Kiểm tra bao bì, đóng gói, nhãn mác, số kiện, trọng lượng, kích thước, hành trình của hàng hóa để đảm bảo tuân thủ đúng quy định vận chuyển.", unit: "C/bay" },
            { id: 4, text: "Hướng dẫn chất xếp vào ULD, lập “Bảng theo dõi chất xếp ULD” chính xác.", unit: "AWB" },
            { id: 5, text: "Tiếp nhận, phục vụ hàng đặc biệt chính xác theo quy định VNA & IATA", unit: "AWB" },
            { id: 6, text: "Hãng vận chuyển bàn giao tài liệu vận chuyển (Cargo Receipt và tài liệu đi kèm) đúng giờ cho CTPV.", unit: "C/bay" },
            { id: 7, text: "Bàn giao các tài liệu hàng hóa đúng giờ, đúng chuyến cho Tổ bay tại máy bay.", unit: "C/bay" },
            { id: 8, text: "Gửi các điện văn liên quan đến hàng hóa Xuất chính xác.", unit: "AWB" },
            { id: 9, text: "Gửi các điện văn liên quan đến hàng hóa Xuất kịp thời (Theo QT thỏa thuận PVHH giữa VNA và Cảng HK)", unit: "AWB" },
            { id: 10, text: "Kế hoạch chất xếp được gửi đúng thời gian cam kết (10’ sau khi nhận được bảng Theo dõi chất xếp ULD)", unit: "C/bay" },
            { id: 11, text: "Số trường hợp bất thường xảy ra đối với hàng hoá Xuất do lỗi của CTPV: Rách, vỡ, hư hỏng / Mất, thất lạc / Sai danh sách / Khác", unit: "AWB" },
            { id: 12, text: "Lập biên bản bất thường đối với hàng hoá Xuất", unit: "AWB" },

            { section: "C. Phục vụ hàng hóa, bưu kiện nhập" },
            { id: 13, text: "Thông báo hàng đến cho người nhận hàng trên AWB (Theo QT thỏa thuận PVHH giữa VNA và Cảng HK)", unit: "AWB" },
            { id: 14, text: "Thời gian tài liệu sẵn sàng để giao cho người nhận hàng tính từ thời gian hạ cánh thực tế (sau ATA)", unit: "AWB" },
            { id: 15, text: "Thời gian hàng hoá sẵn sàng để giao cho người nhận hàng tính từ thời gian hạ cánh thực tế (sau ATA)", unit: "AWB" },
            { id: 16, text: "Lập biên bản bất thường đối với hàng hoá", unit: "AWB" },
            { id: 17, text: "Hàng hoá không phát được phải được thông báo cho Sân bay đi và/hoặc Nhà vận chuyển theo quy định.", unit: "AWB" },
            { id: 18, text: "Số trường hợp bất thường xảy ra do lỗi CTPV: Mất tài liệu / Mất hàng hoá / Rách, vỡ, hư hỏng / Khác", unit: "AWB" },
            { id: 19, text: "Gửi các điện văn liên quan đến hàng hóa nhập chính xác.", unit: "AWB" },
            { id: 20, text: "Gửi các điện văn liên quan đến hàng hóa nhập kịp thời (Theo QT thỏa thuận PVHH giữa VNA và Cảng HK)", unit: "AWB" },

            { section: "D. Chỉ tiêu khác" },
            { id: 21, text: "Tuân thủ các quy định về an toàn, an ninh", unit: "C/bay" }
        ];

        const state = {};
        const sigDrawn = { sig1: false, sig2: false };

        document.getElementById('date-input').valueAsDate = new Date();

        const container = document.getElementById('checklist-container');
        rawData.forEach(item => {
            if (item.section) {
                const secEl = document.createElement('div');
                secEl.className = 'section-title';
                secEl.innerText = item.section;
                container.appendChild(secEl);
            } else {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.id = `item-card-${item.id}`;
                card.innerHTML = `
                    <div class="item-header">
                        <span class="item-no">${String(item.id).padStart(2, '0')}</span>
                        <div class="item-text">${item.text}</div>
                        <span class="item-unit">${item.unit}</span>
                    </div>
                    <div class="status-options">
                        <button type="button" class="opt-btn pass-btn" onclick="setStatus(${item.id}, 'pass')">
                            ✓ Đúng T/C
                        </button>
                        <button type="button" class="opt-btn fail-btn" onclick="setStatus(${item.id}, 'fail')">
                            ✗ Không Đúng
                        </button>
                        <button type="button" class="opt-btn na-btn" onclick="setStatus(${item.id}, 'na')">
                            — K.Áp Dụng
                        </button>
                    </div>
                    <input type="text" class="note-input" id="note-${item.id}" placeholder="Ghi chú thêm...">
                `;
                container.appendChild(card);
            }
        });

        function setStatus(id, val) {
            state[id] = val;
            const card = document.getElementById(`item-card-${id}`);
            const passBtn = card.querySelector('.pass-btn');
            const failBtn = card.querySelector('.fail-btn');
            const naBtn = card.querySelector('.na-btn');

            card.classList.remove('checked-true', 'checked-false', 'checked-na');
            passBtn.classList.remove('active');
            failBtn.classList.remove('active');
            naBtn.classList.remove('active');

            if (val === 'pass') {
                card.classList.add('checked-true');
                passBtn.classList.add('active');
            } else if (val === 'fail') {
                card.classList.add('checked-false');
                failBtn.classList.add('active');
            } else if (val === 'na') {
                card.classList.add('checked-na');
                naBtn.classList.add('active');
            }
        }

        function initSignatureCanvas(id) {
            const canvas = document.getElementById(`canvas-${id}`);
            const wrap = document.getElementById(`wrap-${id}`);
            const ctx = canvas.getContext('2d');
            let isDrawing = false;

            function resize() {
                const rect = wrap.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#002b66';
            }

            window.addEventListener('resize', resize);
            setTimeout(resize, 200);

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            }

            function start(e) {
                isDrawing = true;
                sigDrawn[id] = true;
                const p = getPos(e);
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
            }

            function move(e) {
                if (!isDrawing) return;
                e.preventDefault();
                const p = getPos(e);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
            }

            function stop() {
                if (isDrawing) {
                    isDrawing = false;
                    document.getElementById(`${id}-status`).innerText = "✓ Đã có chữ ký";
                }
            }

            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', move);
            canvas.addEventListener('mouseup', stop);

            canvas.addEventListener('touchstart', start, { passive: false });
            canvas.addEventListener('touchmove', move, { passive: false });
            canvas.addEventListener('touchend', stop);
        }

        initSignatureCanvas('sig1');
        initSignatureCanvas('sig2');

        function clearSignature(id) {
            const canvas = document.getElementById(`canvas-${id}`);
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            sigDrawn[id] = false;
            document.getElementById(`${id}-status`).innerText = "";
        }

        function resetForm() {
            if (confirm("Làm mới toàn bộ bảng kiểm tra?")) location.reload();
        }

        function exportToPDF() {
            const cnVal = document.getElementById('cn-input').value || '.................';
            const flightVal = document.getElementById('flight-input').value || '.................';
            const dateVal = document.getElementById('date-input').value || '.................';
            const inspectorVal = document.getElementById('inspector-input').value || '........................................';

            let sig1ImgSrc = sigDrawn.sig1 ? document.getElementById('canvas-sig1').toDataURL('image/png') : '';
            let sig2ImgSrc = sigDrawn.sig2 ? document.getElementById('canvas-sig2').toDataURL('image/png') : '';

            let tableRowsHTML = '';
            rawData.forEach(item => {
                if (item.section) {
                    tableRowsHTML += `
                        <tr style="background-color: #f3f4f6; font-weight: bold;">
                            <td colspan="7" style="padding: 3.5px 6px; font-size: 9.5pt; color: #000; text-align: left;">${item.section}</td>
                        </tr>
                    `;
                } else {
                    const status = state[item.id];
                    const isPass = status === 'pass' ? '<b>X</b>' : '';
                    const isFail = status === 'fail' ? '<b>X</b>' : '';
                    const isNA = status === 'na' ? '<b>X</b>' : '';
                    const noteVal = document.getElementById(`note-${item.id}`).value || '';

                    tableRowsHTML += `
                        <tr>
                            <td style="text-align: center; font-size: 9.5pt; padding: 3px 2px;">${String(item.id).padStart(2, '0')}</td>
                            <td style="font-size: 9.5pt; padding: 3px 5px; line-height: 1.2;">${item.text}</td>
                            <td style="text-align: center; font-size: 9pt; padding: 3px 2px;">${item.unit}</td>
                            <td style="text-align: center; font-size: 10pt; padding: 3px 2px;">${isPass}</td>
                            <td style="text-align: center; font-size: 10pt; padding: 3px 2px;">${isFail}</td>
                            <td style="text-align: center; font-size: 10pt; padding: 3px 2px;">${isNA}</td>
                            <td style="font-size: 9pt; padding: 3px 4px;">${noteVal}</td>
                        </tr>
                    `;
                }
            });

            const printContainer = document.getElementById('print-area');
            printContainer.innerHTML = `
                <div style="font-family: Arial, sans-serif; color: #000; width: 100%; box-sizing: border-box;">
                    <div style="display: flex; justify-content: space-between; font-size: 9.5pt; font-weight: bold; line-height: 1.25;">
                        <div>TỔNG CÔNG TY HÀNG KHÔNG VIỆT NAM - CTCP<br>CHI NHÁNH KHU VỰC VIỆT NAM</div>
                        <div style="text-align: right;">Mã số: BM-CNVN-060<br>Lần ban hành: 2</div>
                    </div>

                    <div style="text-align: center; font-weight: bold; font-size: 13pt; margin: 8px 0 6px 0;">
