    <script>
        // Data Structure corresponding to BM-CNVN-060
        const rawData = [
            { section: "A. Chỉ số chung" },
            { id: 1, text: "Chuyến bay đi đúng giờ (chỉ tính nguyên nhân chậm giờ do lỗi của công ty phục vụ)", unit: "C/bay" },
            
            { section: "B. Phục vụ hàng hóa, bưu kiện xuất" },
            { id: 2, text: "Hàng hoá được tiếp nhận theo đúng kế hoạch về thời gian nhận hàng (Chuẩn bị mâm thùng, nhân viên tiếp nhận, nhân viên hướng dẫn chất xếp và bốc xếp, nhân viên an ninh soi chiếu).", unit: "C/bay" },
            { id: 3, text: "Kiểm tra bao bì, đóng gói, nhãn mác, số kiện, trọng lượng, kích thước, hành trình của hàng hóa để đảm bảo tuân thủ đúng quy định vận chuyển.", unit: "C/bay" },
            { id: 4, text: "Hướng dẫn chất xếp vào ULD, lập “Bảng theo dõi chất xếp ULD” chính xác.", unit: "AWB" },
            { id: 5, text: "Tiếp nhận, phục vụ hàng đặc biệt chính xác theo quy định VNA & IATA", unit: "AWB" },
            { id: 6, text: "Hãng vận chuyển bàn giao tài liệu vận chuyển (Cargo Receipt và tài liệu đi kèm) đúng giờ cho CTPV.", unit: "C/bay" },
            { id: 7, text: "Bàn giao các tài liệu hàng hóa đúng giờ, đúng chuyến cho Tổ bay tại máy bay.", unit: "C/bay" },
            { id: 8, text: "Gửi các điện văn liên quan đến hàng hóa Xuất chính xác.", unit: "AWB" },
            { id: 9, text: "Gửi các điện văn liên quan đến hàng hóa Xuất kịp thời (Theo QT thỏa thuận PVHH giữa VNA và Cảng HK)", unit: "AWB" },
            { id: 10, text: "Kế hoạch chất xếp được gửi đúng thời gian cam kết (10’ sau khi nhận được bảng Theo dõi chất xếp ULD)", unit: "C/bay" },
            { id: 11, text: "Số trường hợp bất thường xảy ra đối với hàng hoá Xuất do lỗi của CTPV: Rách, vỡ, hư hỏng / Mất, thất lạc / Sai danh sách / Khác", unit: "AWB" },
            { id: 12, text: "Lập biên bản bất thường đối với hàng hoá Xuất", unit: "AWB" },

            { section: "C. Phục vụ hàng hóa, bưu kiện nhập" },
            { id: 13, text: "Thông báo hàng đến cho người nhận hàng trên AWB (Theo QT thỏa thuận PVHH giữa VNA và Cảng HK)", unit: "AWB" },
            { id: 14, text: "Thời gian tài liệu sẵn sàng để giao cho người nhận hàng tính từ thời gian hạ cánh thực tế (sau ATA)", unit: "AWB" },
            { id: 15, text: "Thời gian hàng hoá sẵn sàng để giao cho người nhận hàng tính từ thời gian hạ cánh thực tế (sau ATA)", unit: "AWB" },
            { id: 16, text: "Lập biên bản bất thường đối với hàng hoá", unit: "AWB" },
            { id: 17, text: "Hàng hoá không phát được phải được thông báo cho Sân bay đi và/hoặc Nhà vận chuyển theo quy định.", unit: "AWB" },
            { id: 18, text: "Số trường hợp bất thường xảy ra do lỗi CTPV: Mất tài liệu / Mất hàng hoá / Rách, vỡ, hư hỏng / Khác", unit: "AWB" },
            { id: 19, text: "Gửi các điện văn liên quan đến hàng hóa nhập chính xác.", unit: "AWB" },
            { id: 20, text: "Gửi các điện văn liên quan đến hàng hóa nhập kịp thời (Theo QT thỏa thuận PVHH giữa VNA và Cảng HK)", unit: "AWB" },

            { section: "D. Chỉ tiêu khác" },
            { id: 21, text: "Tuân thủ các quy định về an toàn, an ninh", unit: "C/bay" }
        ];

        // Default Date to Today
        document.getElementById('date-input').valueAsDate = new Date();

        // Render Checklist UI
        const container = document.getElementById('checklist-container');
        rawData.forEach(item => {
            if (item.section) {
                const secEl = document.createElement('div');
                secEl.className = 'section-title';
                secEl.innerText = item.section;
                container.appendChild(secEl);
            } else {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.id = `item-card-${item.id}`;
                card.innerHTML = `
                    <div class="item-header">
                        <span class="item-no">${String(item.id).padStart(2, '0')}</span>
                        <div class="item-text">${item.text}</div>
                        <span class="item-unit">${item.unit}</span>
                    </div>
                    <div class="status-options">
                        <button type="button" class="opt-btn pass-btn" onclick="setStatus(${item.id}, true)">
                            ✓ Đúng T/Chuẩn
                        </button>
                        <button type="button" class="opt-btn fail-btn" onclick="setStatus(${item.id}, false)">
                            ✗ Không Đúng
                        </button>

                    <input type="text" class="note-input" id="note-${item.id}" placeholder="Ghi chú thêm...">
                `;
                container.appendChild(card);
            }
        });

        // State Management
        const state = {};

        function setStatus(id, isPass) {
            state[id] = isPass;
            const card = document.getElementById(`item-card-${id}`);
            const passBtn = card.querySelector('.pass-btn');
            const failBtn = card.querySelector('.fail-btn');

            card.classList.remove('checked-true', 'checked-false');

            if (isPass) {
                card.classList.add('checked-true');
                passBtn.classList.add('active');
                failBtn.classList.remove('active');
            } else {
                card.classList.add('checked-false');
                failBtn.classList.add('active');
                passBtn.classList.remove('active');
            }
        }

        /* --- Touch & Mouse Canvas Signature Setup --- */
        function initSignatureCanvas(id) {
            const canvas = document.getElementById(`canvas-${id}`);
            const wrap = document.getElementById(`wrap-${id}`);
            const ctx = canvas.getContext('2d');
            let isDrawing = false;

            function resize() {
                const rect = wrap.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
                ctx.lineWidth = 2.5;
                ctx.lineCap = 'round';
                ctx.strokeStyle = '#002b66';
            }

            window.addEventListener('resize', resize);
            setTimeout(resize, 200);

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            }

            function start(e) {
                isDrawing = true;
                const p = getPos(e);
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
            }

            function move(e) {
                if (!isDrawing) return;
                e.preventDefault();
                const p = getPos(e);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
            }

            function stop() {
                if (isDrawing) {
                    isDrawing = false;
                    document.getElementById(`${id}-status`).innerText = "Đã ký";
                }
            }

            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', move);
            canvas.addEventListener('mouseup', stop);

            canvas.addEventListener('touchstart', start, { passive: false });
            canvas.addEventListener('touchmove', move, { passive: false });
            canvas.addEventListener('touchend', stop);
        }

        initSignatureCanvas('sig1');
        initSignatureCanvas('sig2');

        function clearSignature(id) {
            const canvas = document.getElementById(`canvas-${id}`);
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById(`${id}-status`).innerText = "";
        }

        function resetForm() {
            if (confirm("Bạn có chắc chắn muốn làm mới toàn bộ bảng kiểm tra?")) {
                location.reload();

        }

        /* --- PDF Generation logic --- */
        function exportToPDF() {
            const flight = document.getElementById('flight-input').value || 'Flight';
            const dateStr = document.getElementById('date-input').value || 'Date';
            const filename = `BM-CNVN-060_${flight}_${dateStr}.pdf`;

            // Convert Signatures to Static Images for seamless PDF rendering
            ['sig1', 'sig2'].forEach(id => {
                const canvas = document.getElementById(`canvas-${id}`);
                const img = document.getElementById(`img-${id}`);
                img.src = canvas.toDataURL('image/png');
                img.style.display = 'block';
                canvas.style.display = 'none';
            });

            // Build formal print table view temporarily
            const pdfContainer = document.createElement('div');
            pdfContainer.style.padding = '15px';
            pdfContainer.style.fontFamily = 'Arial, sans-serif';

            const cnVal = document.getElementById('cn-input').value || '.................';
            const flightVal = document.getElementById('flight-input').value || '.................';
            const dateVal = document.getElementById('date-input').value || '.................';
            const inspectorVal = document.getElementById('inspector-input').value || '........................................';

            let tableRowsHTML = '';
            rawData.forEach(item => {
                if (item.section) {
                    tableRowsHTML += `
                        <tr style="background-color: #f3f4f6; font-weight: bold;">
                            <td colspan="6" style="padding: 6px; font-size: 11px;">${item.section}</td>
                        </tr>
                    `;
                } else {
                    const status = state[item.id];
                    const isPass = status === true ? '<b>X</b>' : '';
                    const isFail = status === false ? '<b>X</b>' : '';
                    const noteVal = document.getElementById(`note-${item.id}`).value || '';

                    tableRowsHTML += `
                        <tr>
                            <td style="text-align: center; width: 30px;">${String(item.id).padStart(2, '0')}</td>
                            <td>${item.text}</td>
                            <td style="text-align: center; width: 60px;">${item.unit}</td>
                            <td style="text-align: center; width: 50px;">${isPass}</td>
                            <td style="text-align: center; width: 50px;">${isFail}</td>
                            <td style="width: 100px;">${noteVal}</td>
                        </tr>
                    `;
                }
            });

            const sig1ImgSrc = document.getElementById('canvas-sig1').toDataURL('image/png');
            const sig2ImgSrc = document.getElementById('canvas-sig2').toDataURL('image/png');

            pdfContainer.innerHTML = `
                <div style="display: flex; justify-content: space-between; font-size: 10px; font-weight: bold; border-bottom: 2px solid #0056b3; padding-bottom: 5px;">
                    <div>TỔNG CÔNG TY HÀNG KHÔNG VIỆT NAM - CTCP<br>CHI NHÁNH KHU VỰC VIỆT NAM</div>
                    <div style="text-align: right;">Mã số: BM-CNVN-060<br>Lần ban hành: 2</div>
                </div>
                <div style="text-align: center; color: #0056b3; font-weight: bold; font-size: 15px; margin: 12px 0;">
                    CHECK-LIST KIỂM SOÁT CHẤT LƯỢNG DỊCH VỤ HÀNG HÓA
                </div>
                <div style="font-size: 11px; margin-bottom: 10px; line-height: 1.6;">
                    Chi nhánh: <b>${cnVal}</b> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                    Số hiệu chuyến bay: <b>${flightVal}</b> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                    Ngày: <b>${dateVal}</b><br>
                    Người kiểm soát: <b>${inspectorVal}</b>
                </div>

                <table class="pdf-table" style="width: 100%; border-collapse: collapse; font-size: 10px;" border="1" cellPadding="4">
                    <thead>
                        <tr style="background-color: #f3f4f6;">
                            <th style="width: 30px;">STT</th>
                            <th>Tiêu chuẩn</th>
                            <th style="width: 50px;">Đơn vị</th>
                            <th style="width: 50px;">Đúng T/C</th>
                            <th style="width: 50px;">Không đúng</th>
                            <th style="width: 100px;">Ghi chú</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRowsHTML}
                    </tbody>
                </table>

                <div style="margin-top: 20px; display: flex; justify-content: space-between; text-align: center; font-size: 11px; font-weight: bold;">
                    <div style="width: 45%;">
                        CÔNG TY PHỤC VỤ<br><br>
                        <img src="${sig1ImgSrc}" style="max-height: 60px; max-width: 100%;"><br>
                    </div>
                    <div style="width: 45%;">
                        ĐẠI DIỆN VNA<br><br>
                        <img src="${sig2ImgSrc}" style="max-height: 60px; max-width: 100%;"><br>
                    </div>
                </div>
            `;

            // Render PDF using html2pdf.js
            const opt = {
                margin:       [10, 10, 10, 10],
                filename:     filename,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(pdfContainer).save().then(() => {
                // Restore Signatures on Mobile View
                ['sig1', 'sig2'].forEach(id => {
                    const canvas = document.getElementById(`canvas-${id}`);
                    const img = document.getElementById(`img-${id}`);
                    img.style.display = 'none';
                    canvas.style.display = 'block';
                });
            });
        }
    </script>
</body>
</html>
